# nginx/default.conf

upstream api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    # Serve the built React app for everything else.
    root /usr/share/nginx/html;
    index index.html;

    # API requests go to Django
    location /api/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django admin goes to Django
    location /admin/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django static files go to Django
    location /static/ {
        proxy_pass http://api;
    }

    # Everything else goes to React. try_files makes client-side routing work:
    # if the path isn't a real file, fall back to index.html so React Router handles it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}